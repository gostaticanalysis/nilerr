name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: jobs only need to read the repository.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task:
    name: task ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [test, vet, lint, vuln, actionlint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run task
        run: task "$TASK"
        env:
          TASK: ${{ matrix.task }}
