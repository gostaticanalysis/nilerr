name: pinact

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - aqua.yaml

permissions: {}

jobs:
  pinact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check actions are pinned
        run: pinact run --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
